name: SELFACS import and debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfacs-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.import.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import source if required
        id: import
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f .selfacs-upstream ]; then
            bash scripts/import-upstream.sh
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" 'platforms;android-37.0' || "$sdk" 'platforms;android-37'
          cd "$ANDROID_HOME/platforms"
          if [ ! -d android-37 ] && [ -d android-37.0 ]; then ln -s android-37.0 android-37; fi
          test -f android-37/android.jar
      - name: Prepare upstream build directories
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/{debug/desugarDebugFileDependencies,release/desugarReleaseFileDependencies}
          mkdir -p core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease
          mkdir -p composite-builds/build-logic/desugaring-core
          touch core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease/baseline-prof.txt
          chmod +x gradlew
      - name: Build upstream editor dependency
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/sora-editor"
          git -C "$RUNNER_TEMP/sora-editor" fetch --depth=1 https://github.com/nullij/sora-editor.git aa46c19fe01e0721959d308fe2a5df408592f1a4
          git -C "$RUNNER_TEMP/sora-editor" checkout --detach FETCH_HEAD
          cat > "$RUNNER_TEMP/no-sign.init.gradle" <<'EOF'
          gradle.projectsEvaluated {
            rootProject.allprojects { p ->
              def s = p.extensions.findByName("signing")
              if (s != null) s.required = false
            }
          }
          EOF
          (
            cd "$RUNNER_TEMP/sora-editor"
            v=build-logic/convention/src/main/kotlin/Versions.kt
            sed -i 's/private const val version = "0.24.6"/private const val version = "0.24.7-acs"/' "$v"
            sed -i 's/const val versionCode = 95/const val versionCode = 96/' "$v"
            chmod +x gradlew
            ./gradlew :editor:publishToMavenLocal -I "$RUNNER_TEMP/no-sign.init.gradle" --stacktrace
          )
          find . -name libs.versions.toml -not -path '*/build/*' -exec sed -i 's/^\(editor = \)"0.24.7-acs"/\1"0.24.7-acs-SNAPSHOT"/' {} +
      - name: Test AI edit planner
        run: ./gradlew :core:app:testDebugUnitTest --tests com.tom.rv2ide.artificial.review.EditPlanTest --tests com.tom.rv2ide.flutter.FlutterWorkspaceTest --stacktrace --no-daemon
      - name: Assemble debug APK
        run: |
          ./gradlew :core:app:assembleDebug --stacktrace --no-daemon -DMAIN_VERSION=1.0.0 -DREVISION_NUM=05 -DANDROID_VERSION_CODE=1050 -DPROJECT_CONFIG_KT_BASE_VERSION_CODE=1050
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SELFACS-debug-apks
          path: core/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
